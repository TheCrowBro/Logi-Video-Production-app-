<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="robots" content="noindex">
<title>Sign in to Google for Vdex</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.5 -apple-system,system-ui,sans-serif;background:#14110f;color:#f1e6cf;padding:24px;text-align:center}
main{max-width:30rem}h1{font-size:1.3rem;margin:0 0 .6em}p{margin:.5em 0}.small{font-size:.9rem;opacity:.75}
button{font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:0;background:#e0a43a;color:#14110f;cursor:pointer;margin-top:12px}button[disabled]{opacity:.5}
</style>
</head>
<body>
<main>
<h1>Sign in to Google for Vdex</h1>
<p id="t">Tap the button, sign in and tap Allow. Vdex only uses its own private area of your Google Drive, and the “Vdex bookings” calendar it makes.</p>
<button id="go" type="button" disabled>Continue with Google</button>
<p id="alt" hidden><button id="other" type="button">Sign in the other way</button><br><span class="small">If Google’s window could not open here.</span></p>
</main>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="js/signin-google.js"></script>
</body>
</html>

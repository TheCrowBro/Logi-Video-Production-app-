<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Invoice</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #e9e4da; color: #111; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .bar .who { font-weight: 600; }
  .bar .who small { display: block; font-weight: 400; color: #555; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #fff; border: 1px solid #ccc; }
  .tag.paid { color: #1f7a3f; border-color: #1f7a3f; } .tag.over { color: #b3261e; border-color: #b3261e; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { padding: 9px 14px; border-radius: 10px; border: 1px solid #333; background: #fff; color: #111; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn.primary { background: #111; color: #fff; border-color: #111; }
  .paper { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden; }
  .msg { background: #fff; border-radius: 12px; padding: 24px; }
  .foot { text-align: center; color: #666; font-size: 12px; margin: 18px 0 32px; }
  .foot a { color: #444; }
  @media print { body { background: #fff; } .bar, .foot { display: none; } .paper { box-shadow: none; border-radius: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <div id="doc"><div class="msg">Opening the invoice…</div></div>
  <p class="foot">Made with <a href="./">Vdex</a>. The document travels inside the link itself; nothing was stored online.</p>
</div>
<script type="module" src="js/invoice-page.js"></script>
</body>
</html>

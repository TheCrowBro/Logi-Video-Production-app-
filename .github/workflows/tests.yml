# The browser specs (tests/specs) for pull requests and on demand, and the desktop smoke test whenever the desktop app
# changes. Pushes to the working branch are already tested by "Publish the website" (pages.yml), so they are not run
# twice: the repository is private, and every minute of GitHub's build time counts.
name: Tests
on:
  push:
    paths: ['desktop/**', 'package.json', 'package-lock.json', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-output
          path: tests/output
          if-no-files-found: ignore
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: xvfb-run -a npm run test:desktop

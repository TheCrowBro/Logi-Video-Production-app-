# Builds the one-click installers: Vdex-Setup-<version>.exe (Windows), Vdex-<version>.pkg (Mac) and
# Vdex-<version>.AppImage (Linux), plus the latest*.yml update metadata that installed apps read. Run it from the Actions tab (Run workflow) and download the files from the
# run's Artifacts, or push a tag such as v1.1.0 and the installers are attached to a release of that name.
name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/stamp-build.mjs
        env:
          BUILD_SHA: ${{ github.sha }}
      # Signing is optional: add the secrets named in the README and the builds come out signed (and the Mac one
      # notarized, which lets it update itself). Without them the installers are unsigned, as before.
      - id: certs
        shell: bash
        run: |
          echo "mac=$([ -n "$MAC_P12" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "notarize=$([ -n "$MAC_P12" ] && [ -n "$APPLE_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          MAC_P12: ${{ secrets.MAC_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
      - run: npm run dist -- ${{ matrix.args }} ${{ matrix.os == 'macos-latest' && steps.certs.outputs.notarize == 'true' && '--config.mac.notarize=true' || '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.certs.outputs.mac }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vdex-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.AppImage
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: installers/*

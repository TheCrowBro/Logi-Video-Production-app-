# Publishes the app to GitHub Pages.
#
# How a change reaches the site: a push to the working branch runs the browser tests; when they pass, the
# "mirror" job moves main to that same commit and starts this workflow again on main, where the "deploy" job
# stamps the build and publishes. GitHub's github-pages environment only accepts deployments made from main,
# which is why the deploy always happens from there, and why main is always exactly what is live.
# "Run workflow" on main from the Actions tab publishes on demand.
name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
      - claude/videographer-gear-app-xlg8eb
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # runs queue up; the newest pending one replaces older pending ones
jobs:
  test:
    # The site only updates when the browser specs pass, so a broken push never reaches people's phones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm test
  mirror:
    # A tested push to the working branch becomes main, and main publishes.
    needs: test
    if: github.ref == 'refs/heads/claude/videographer-gear-app-xlg8eb'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to move main
      actions: write    # to start the publish run on main
    steps:
      - name: Move main to this commit (fast-forward only) and publish it
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$GITHUB_SHA"
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node tools/stamp-build.mjs   # stamps this commit into the app so installed copies notice the update
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true   # switches Pages on for the repo the first time
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Builds the Android app for Google Play: a Trusted Web Activity that opens the live Vdex website inside a real
# app (android/, generated with Bubblewrap). Runs when the Android project changes, or by hand from the Actions tab.
#
# Signing: the upload key lives in android/upload-key.keystore.enc, unlocked with the ANDROID_KEY_PASSPHRASE
# repository secret. Without that secret the build is signed with a throwaway key: fine for trying the .apk on a
# phone, but never to be uploaded to Google Play (the first upload fixes the key Play expects), so such a build keeps no
# files. A build signed with the upload key keeps only vdex-android.aab, the file Google Play takes, as this run's
# artifact for 3 days: the app is sold on Google Play, so it is not on a public release page any more. (While the
# repository is public, anyone signed in to GitHub can download a run's artifacts; an .aab does not install on a phone
# as it is, and the app only opens the website.)
name: Android app
on:
  push:
    branches: [claude/videographer-gear-app-xlg8eb, main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use JDK 17 and the preinstalled Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Unlock the upload key, or make a throwaway test key
        env:
          ANDROID_KEY_PASSPHRASE: ${{ secrets.ANDROID_KEY_PASSPHRASE }}
        run: |
          cd android
          if [ -n "$ANDROID_KEY_PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 600000 -in upload-key.keystore.enc -out upload-key.keystore -pass env:ANDROID_KEY_PASSPHRASE
            echo "KEY_KIND=upload key" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore upload-key.keystore -storetype PKCS12 -alias vdex -keyalg RSA -keysize 2048 -validity 10000 -storepass testing-only -keypass testing-only -dname "CN=Vdex test build"
            echo "KEY_KIND=temporary test key (add the ANDROID_KEY_PASSPHRASE secret for a Play-ready build)" >> "$GITHUB_ENV"
          fi
      - name: Build the bundle and the apk
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --quiet bundleRelease assembleRelease
      - name: Sign them
        env:
          PASS: ${{ secrets.ANDROID_KEY_PASSPHRASE || 'testing-only' }}
        run: |
          cd android
          BT="$ANDROID_HOME/build-tools/36.0.0"
          cp app/build/outputs/bundle/release/app-release.aab vdex-android.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload-key.keystore -storepass "$PASS" -keypass "$PASS" vdex-android.aab vdex > /dev/null
          jarsigner -verify vdex-android.aab > /dev/null
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks upload-key.keystore --ks-key-alias vdex --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out vdex-android.apk aligned.apk
          "$BT/apksigner" verify --print-certs vdex-android.apk | grep -i "SHA-256" | sed 's/.*: //' > fingerprint.txt
          echo "Signed with the $KEY_KIND. Certificate SHA-256: $(cat fingerprint.txt)"
          rm -f upload-key.keystore aligned.apk
      - if: env.KEY_KIND == 'upload key'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vdex-android
          retention-days: 3
          path: android/vdex-android.aab
      - name: Where to find the files
        run: |
          {
            echo "### Android app $(python3 -c "import json; m=json.load(open('android/twa-manifest.json')); print(m['appVersionName'] + ' (build ' + str(m['appVersionCode']) + ')')")"
            echo ""
            if [ "$KEY_KIND" = "upload key" ]; then
              echo "Download **vdex-android** under *Artifacts* at the bottom of this page (kept for 3 days). It holds **vdex-android.aab**, the file Google Play takes."
            else
              echo "**Not for Google Play:** this build was signed with a temporary key, so no file was kept. Add the ANDROID_KEY_PASSPHRASE secret (docs/google-play.md, Step 2) and run it again."
            fi
            echo ""
            echo "Signed with the ${KEY_KIND}. Certificate SHA-256: $(cat android/fingerprint.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
  unpublish:
    # The app is sold on Google Play, so the old public "android-latest" pre-release (a free download of the app) and
    # the app files kept by earlier runs are removed. Its own job, so it runs even if a build fails and only it holds
    # write access. A release that is already gone is fine; any other error fails the run.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Remove the old public android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete android-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            echo "Removed the android-latest pre-release."
          else
            echo "No android-latest pre-release: nothing to remove."
          fi
      - name: Remove the app files kept by earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=vdex-android&per_page=100" --jq ".artifacts[] | select(.workflow_run.id != $GITHUB_RUN_ID) | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "Removed artifact $id"; done
